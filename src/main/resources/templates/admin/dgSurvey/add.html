<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('断面测深登记')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">测量单号</label>
                    <div class="layui-input-block">
                        <input type="text" name="surveyNo" lay-verify="required" autocomplete="off" placeholder="测量单号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">所属河段</label>
                    <div class="layui-input-block">
                        <select name="reachId" lay-verify="required">
                            <option value="">请选择河段</option>
                            <option th:each="reach : ${reaches}" th:value="${reach.id}"
                                    th:text="${reach.reachCode} + ' ' + ${reach.reachName}"
                                    th:disabled="${reach.status == 1}"></option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">判定规则</label>
                    <div class="layui-input-block">
                        <select name="ruleId" id="ruleId" lay-verify="required" lay-filter="ruleId">
                            <option value="">请选择判定规则</option>
                            <option th:each="rule : ${rules}" th:value="${rule.id}"
                                    th:if="${rule.status == 0}"
                                    th:text="${rule.ruleCode} + ' ' + ${rule.ruleName}"
                                    th:attr="data-dev1=${rule.dev1Max},data-dev2=${rule.dev2Max},data-dev3=${rule.dev3Max}"></option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">浅点率(%)</label>
                    <div class="layui-input-block">
                        <input type="number" step="0.01" min="0" max="100" name="shoalRate" id="shoalRate" lay-verify="required|number" autocomplete="off" placeholder="浅点率" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">浅情等级</label>
                    <div class="layui-input-block">
                        <input type="text" id="shoalLevelText" class="layui-input layui-disabled" disabled placeholder="由系统按所选规则自动判定，无需填写">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">测量日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="surveyDate" id="surveyDate" lay-verify="required" autocomplete="off" placeholder="yyyy-MM-dd HH:mm:ss" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">测量人</label>
                    <div class="layui-input-block">
                        <input type="text" name="surveyBy" lay-verify="required" autocomplete="off" placeholder="测量人" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入备注" name="remark" class="layui-textarea"></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="dgSurvey-save">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'laydate'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let laydate = layui.laydate;
        let MODULE_PATH = rootPath+"/DgSurveyController";

        laydate.render({elem: '#surveyDate', type: 'datetime'});

        //浅情等级预览：与后端判定口径一致（<=良好上限 良好；<=一般上限 一般；<=紧张上限 紧张；其余 告急）
        function refreshLevel() {
            let opt = $('#ruleId').find('option:selected');
            let rate = parseFloat($('#shoalRate').val());
            let dev1 = parseFloat(opt.attr('data-dev1'));
            let dev2 = parseFloat(opt.attr('data-dev2'));
            let dev3 = parseFloat(opt.attr('data-dev3'));
            let text = '';
            if (!isNaN(rate) && !isNaN(dev1) && !isNaN(dev2) && !isNaN(dev3)) {
                if (rate <= dev1) {
                    text = '良好';
                } else if (rate <= dev2) {
                    text = '一般';
                } else if (rate <= dev3) {
                    text = '紧张';
                } else {
                    text = '告急';
                }
            }
            $('#shoalLevelText').val(text === '' ? '' : text + '（系统判定）');
        }
        form.on('select(ruleId)', refreshLevel);
        $('#shoalRate').on('input', refreshLevel);

        //保存
        form.on('submit(dgSurvey-save)', function (data) {
            $.ajax({
                url: MODULE_PATH+'/add',
                data: data.field,
                dataType: 'json',
                contentType: 'application/x-www-form-urlencoded',
                type: 'post',
                success: function (result) {
                    if (result.code==200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                            parent.layui.table.reload("dgSurvey-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1000});
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
