<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('疏浚计划修改')"/>
</head>
<body>
<form class="layui-form" action="" th:object="${DgPlan}">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">

                <div class="layui-form-item layui-hide">
                    <label class="layui-form-label">编号</label>
                    <div class="layui-input-block">
                        <input type="text" th:value="*{id}" name="id" autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">计划单号</label>
                    <div class="layui-input-block">
                        <input th:value="*{dredgeNo}" type="text" name="dredgeNo" lay-verify="required" autocomplete="off" placeholder="计划单号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">所属河段</label>
                    <div class="layui-input-block">
                        <select name="reachId" lay-verify="required">
                            <option value="">请选择河段</option>
                            <option th:each="reach : ${reaches}" th:value="${reach.id}"
                                    th:text="${reach.reachCode} + ' ' + ${reach.reachName}"
                                    th:selected="${reach.id == DgPlan.reachId}"
                                    th:disabled="${reach.status == 1}"></option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">计划月份</label>
                    <div class="layui-input-block">
                        <input th:value="*{planMonth}" type="text" name="planMonth" id="planMonth" lay-verify="required" autocomplete="off" placeholder="yyyy-MM" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">计划方量(m³)</label>
                    <div class="layui-input-block">
                        <input th:value="*{planCube}" type="number" step="1" min="1" name="planCube" id="planCube" lay-verify="required|number" autocomplete="off" placeholder="计划方量，须为正数" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">完成方量(m³)</label>
                    <div class="layui-input-block">
                        <input th:value="*{doneCube}" type="number" step="1" min="0" name="doneCube" id="doneCube" lay-verify="required|number" autocomplete="off" placeholder="完成方量，不得超过计划方量" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">完成率(%)</label>
                    <div class="layui-input-block">
                        <input type="text" id="doneRateText" class="layui-input layui-disabled" disabled
                               th:value="${DgPlan.doneRate} + '%（系统计算）'">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">编制人</label>
                    <div class="layui-input-block">
                        <input th:value="*{planBy}" type="text" name="planBy" lay-verify="required" autocomplete="off" placeholder="编制人" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入备注" name="remark" class="layui-textarea" th:text="*{remark}"></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="dgPlan-update">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'laydate'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let laydate = layui.laydate;
        let MODULE_PATH = rootPath+"/DgPlanController";

        laydate.render({elem: '#planMonth', type: 'month', format: 'yyyy-MM'});

        //完成率预览：保存时由系统按两个方量重新计算，此处仅作提示
        function refreshRate() {
            let plan = parseFloat($('#planCube').val());
            let done = parseFloat($('#doneCube').val());
            let text = '';
            if (!isNaN(plan) && !isNaN(done) && plan > 0) {
                text = (done * 100 / plan).toFixed(2) + '%';
            }
            $('#doneRateText').val(text === '' ? '' : text + '（系统计算）');
        }
        $('#planCube').on('input', refreshRate);
        $('#doneCube').on('input', refreshRate);

        //修改保存
        form.on('submit(dgPlan-update)', function (data) {
            $.ajax({
                url: MODULE_PATH+'/edit',
                data: data.field,
                dataType: 'json',
                contentType: 'application/x-www-form-urlencoded',
                type: 'post',
                success: function (result) {
                    if (result.code==200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                            parent.layui.table.reload("dgPlan-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1000});
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
